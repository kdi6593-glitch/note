<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>상담 전에 먼저 여쭙니다</title>
<style>
  :root { --navy:#1f3864; --ink:#16202e; --mute:#6b7685; --line:#dfe4ea; --bg:#f4f6f9; --ok:#1d7a4f; --red:#c8102e; --pick:#e8eef9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif; font-size:16px; line-height:1.55; }
  header { background:var(--navy); color:#fff; padding:22px 20px 18px; }
  header .eye { font-size:13px; opacity:.8; letter-spacing:.02em; }
  header h1 { margin:4px 0 8px; font-size:23px; line-height:1.3; }
  header p { margin:0; font-size:14.5px; opacity:.92; }
  .bar { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:9px 20px; font-size:13px; color:var(--mute); display:flex; align-items:center; gap:10px; }
  .bar .track { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar .fill { height:100%; width:0; background:var(--navy); transition:width .2s; }
  main { max-width:640px; margin:0 auto; padding:14px 14px 40px; }
  section { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 16px 6px; margin:0 0 14px; }
  section > h2 { margin:0 0 4px; font-size:17px; color:var(--navy); }
  section > .lead { margin:0 0 6px; font-size:13.5px; color:var(--mute); }
  .q { padding:15px 0; border-top:1px solid var(--line); }
  .q:first-of-type { border-top:0; }
  .q .t { font-weight:700; font-size:16.5px; line-height:1.45; }
  .q .h { font-size:13px; color:var(--mute); margin-top:3px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .opts button { appearance:none; border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:11px 14px; font-size:15.5px; font-family:inherit; min-height:46px; cursor:pointer; text-align:left; }
  .opts button[aria-pressed="true"] { border-color:var(--navy); background:var(--pick); color:var(--navy); font-weight:700; }
  input[type=text], input[type=tel], textarea { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 13px; font-size:16px; font-family:inherit; margin-top:10px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus { outline:none; border-color:var(--navy); }
  textarea { min-height:84px; resize:vertical; }
  .row2 { display:flex; gap:8px; } .row2 > * { flex:1; min-width:0; }
  .more { margin-top:10px; padding:12px; background:var(--bg); border-radius:10px; display:none; }
  .more .l { font-size:13.5px; font-weight:700; margin-top:10px; } .more .l:first-child { margin-top:0; }
  .agree { display:flex; gap:10px; align-items:flex-start; padding:14px 0 12px; font-size:14.5px; }
  .agree input { width:22px; height:22px; margin:1px 0 0; flex:0 0 auto; accent-color:var(--navy); }
  .send { display:block; width:100%; border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:800; font-family:inherit; color:#fff; background:var(--navy); margin:0 0 10px; min-height:56px; cursor:pointer; }
  .send.alt { background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .note { font-size:12.5px; color:var(--mute); margin:6px 2px 14px; }
  .warn { color:var(--red); font-size:13.5px; font-weight:700; margin:0 0 10px; display:none; }
  pre { white-space:pre-wrap; word-break:break-all; background:var(--bg); border-radius:10px; padding:12px; font-size:13px; font-family:inherit; max-height:220px; overflow:auto; margin:0 0 12px; display:none; }
  .done { display:none; color:var(--ok); font-weight:700; font-size:14.5px; margin:0 0 12px; }
</style>
</head>

<header>
  <div class="eye">상담 전에</div>
  <h1>먼저 몇 가지 여쭙니다</h1>
  <p>3분이면 됩니다. 편하게 눌러서 골라 주세요. 답하기 어려운 것은 건너뛰셔도 괜찮습니다.</p>
</header>

var CONFIG = (function () {
  var q = {}; try { (typeof location !== 'undefined' ? location.search : '').replace(/^[?]/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/[+]/g, ' ')); }); } catch (e) {}
  return { 받는번호: (q.t || '').replace(/[^0-9]/g, '').slice(0, 11), 담당: (q.n || '').replace(/[<>&"']/g, '').slice(0, 10) };
